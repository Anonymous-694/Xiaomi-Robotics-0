# @package _global_
# GenieSim G2 (task family g2op_gs_if) SFT data config — EEF-control route. **v2.1 example.**
# See geniesim_deploy/DESIGN_GENIESIM_SFT.md.
#
# active_parts: only the Cartesian EEF pose + gripper channels are supervised; the joint channels
#   (7-12, 21-26) are masked out because G2's 7-DOF arms don't fit XR-0's 6-DOF joint slots and
#   control is delegated to GenieSim's built-in IK. This value travels with the ckpt's config.py,
#   so deploy.py masks the same channels at inference (server.py zeroes them on the output).
#
# train_path entries point at the CONVERTER OUTPUT, not the raw lerobot dirs. Convert first:
#   python tools/lerobot_to_xr0.py \
#       /path/to/geniesim_data/instruction_and_robust/v21/pick_block_color_500 ... \
#       --out /path/to/xr0_data/g2op_if
# which writes /path/to/xr0_data/g2op_if/<dataset>/json — the paths listed below. Replace the
# /path/to/... placeholders with your own locations.
#
# mean/std BELOW are PLACEHOLDERS (identity: mean=0, std=1 → no normalization). Before training,
# regenerate them for your data — on a host that can read the lerobot dirs:
#   python tools/compute_norm_stats.py --lerobot \
#       /path/to/geniesim_data/instruction_and_robust/v21/<dataset> ... --out /tmp/g2_stats.yaml
#   then paste its mean/std blocks below (shape (action_length, 32); only the active EEF/gripper
#   dims 0-6, 14-20 carry stats, masked dims stay mean=0/std=1).

data:
  type: BaseDataModule
  params:
    type: json
    max_steps: ${trainer.max_steps}

    train_datasets:
      batch_size: 16
      action_length: 30
      active_parts:
      - left_ee_pos
      - left_ee_aa
      - left_gripper
      - right_ee_pos
      - right_ee_aa
      - right_gripper
      train_path:
      - /path/to/xr0_data/g2op_if/pick_billards_color_500/json
      - /path/to/xr0_data/g2op_if/pick_block_color_500/json
      - /path/to/xr0_data/g2op_if/pick_block_number_500/json
      - /path/to/xr0_data/g2op_if/pick_block_shape_500/json
      - /path/to/xr0_data/g2op_if/pick_block_size_500/json
      - /path/to/xr0_data/g2op_if/pick_common_sense_500/json
      - /path/to/xr0_data/g2op_if/pick_follow_logic_(or)_500/json
      - /path/to/xr0_data/g2op_if/pick_object_type_500/json
      - /path/to/xr0_data/g2op_if/pick_specific_object_500/json
      - /path/to/xr0_data/g2op_if/straighten_object_500/json
